# Chạy từ thư mục project: mosquitto -c broker/mosquitto.conf -v
# Thay bind thành IP LAN cụ thể nếu ESP32 cần kết nối; không mở port Internet.
listener 8883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file broker/passwords
acl_file broker/acl
cafile broker/certs/ca.crt
certfile broker/certs/server.crt
keyfile broker/certs/server.key
tls_version tlsv1.2
persistence true
persistence_location data/mosquitto/
max_packet_size 4096
message_size_limit 2048
max_queued_messages 256
max_inflight_messages 20
log_type error
log_type warning
log_type notice
